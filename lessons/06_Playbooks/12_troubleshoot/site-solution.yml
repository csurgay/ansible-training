---
# SOLUTION — do not distribute until after the debrief.

- name: Configure web server
  hosts: webservers
  become: true                       # FIX 1: was `false`

  vars:
    http_port: 80
    nginx_port: 80                   # FIX 4: was missing entirely

  tasks:
    - name: Install nginx
      ansible.builtin.package:
        name: nginx
        state: present
      # FIX 3: notify removed from here...

    - name: Deploy nginx config from template
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify: Restart nginx          # ...and moved here, where it belongs

    - name: Ensure nginx is running and enabled
      ansible.builtin.service:       # FIX 2: was `ansible.builtin.servics` (typo)
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
